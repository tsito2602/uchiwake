<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta id="app-theme-color" name="theme-color" content="#fbf8f2"/>
    <meta name="apple-mobile-web-app-title" content="uchiwake"/>
    <link id="app-icon" rel="icon" href="/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v6.png"/>
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/boot.css"/>
    <title>uchiwake — ふたりの家計</title>
  </head>
  <body>
    <div id="initial-boot" role="status" aria-label="uchiwakeを読み込み中">
      <div class="boot-brand" aria-hidden="true">
        <div class="boot-symbol">
          <canvas id="boot-canvas"></canvas>
          <img id="boot-still" src="/logo-light.svg" alt=""/>
        </div>
        <strong class="boot-name"><span style="--letter:0">u</span><span style="--letter:1">c</span><span style="--letter:2">h</span><span style="--letter:3">i</span><span style="--letter:4">w</span><span style="--letter:5">a</span><span style="--letter:6">k</span><span style="--letter:7">e</span></strong>
      </div>
    </div>
    <div id="root"></div>
    <noscript><style>#initial-boot{display:none}</style>uchiwakeの利用にはJavaScriptを有効にしてください。</noscript>
    <script defer src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
